

name: Build Pub Darts Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -o PubDartsNight_Android_v2_FIXED.zip -d android-project
          echo "Android project contents:"
          find android-project -maxdepth 4 -type f

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin JVM targets
        run: |
          cd android-project/pubdarts_fix

          cat >> app/build.gradle.kts <<'EOF'

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "1.8"
          }
          EOF

          echo "JVM target fix added."
          tail -n 15 app/build.gradle.kts

      - name: Build APK
        run: |
          cd android-project/pubdarts_fix
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pub-Darts-Night-APK
          path: android-project/pubdarts_fix/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
