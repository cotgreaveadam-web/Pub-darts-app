name: Build Pub Darts Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          mkdir -p android-project
          unzip -o PubDartsNight_Android_v1.zip -d android-project
          echo "Contents:"
          find android-project -maxdepth 5 -type f

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd android-project
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pub-Darts-Night-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
