

name: Build Pub Darts Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -o PubDartsNight_Android_v2_FIXED.zip -d android-project
          echo "Contents:"
          find android-project -maxdepth 5 -type f

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find project and fix JVM target
        run: |
          PROJECT_DIR="$(dirname "$(find android-project -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1)")"
          echo "Android project found at: $PROJECT_DIR"

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          echo "" >> "$APP_GRADLE"
          echo 'tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {' >> "$APP_GRADLE"
          echo '    kotlinOptions.jvmTarget = "1.8"' >> "$APP_GRADLE"
          echo '}' >> "$APP_GRADLE"

          echo "Updated build.gradle.kts:"
          tail -n 15 "$APP_GRADLE"

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find android-project -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1)")"
          echo "Building project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pub-Darts
